name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: px
          POSTGRES_PASSWORD: px
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U px" --health-interval 5s --health-retries 10
    env:
      APP_MODE: demo
      DEMO_LOGIN_ENABLED: "true"
      DATABASE_URL: postgres://px:px@localhost:5432/postgres
      AUTH_SECRET: ci-only-secret-not-for-any-deployment
      PAYMENT_PROVIDER: demo
      IDENTITY_PROVIDER: demo
      FOOTBALL_DATA_PROVIDER: fixture
      NOTIFICATION_PROVIDER: demo
      PAYMENT_WEBHOOK_SECRET: demo-ci-webhook-secret
      WEB_BASE_URL: http://localhost:3000
      DROP_SEED_KEY: d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0
      PGHOST: localhost
      PGUSER: px
      PGPASSWORD: px
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit- en integratietests (Vitest)
        run: pnpm test
      - name: Database-constrainttests
        run: pnpm test:db
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Demo-database klaarzetten
        env:
          DATABASE_URL: postgres://px:px@localhost:5432/px_demo
        run: |
          psql -d postgres -c "CREATE DATABASE px_demo"
          pnpm db:migrate
          pnpm db:seed
      - name: End-to-end (web + worker tegen demo-database)
        env:
          DATABASE_URL: postgres://px:px@localhost:5432/px_demo
          E2E_BASE_URL: http://localhost:3000
        run: |
          pnpm --filter @px/web exec playwright install --with-deps chromium
          (cd apps/web && pnpm start > ../../web.log 2>&1 &)
          (node apps/worker/src/main.ts > worker.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:3000/api/v1/health && break; sleep 1; done
          pnpm test:e2e
      - name: Back-up- en hersteloefening (op de demo-database na e2e)
        env:
          DATABASE_URL: postgres://px:px@localhost:5432/px_demo
          PG_DOCKER_IMAGE: postgres:16
        run: |
          pkill -f "apps/worker/src/main.ts" || true
          pkill -f "next start" || true
          sleep 2
          pnpm ops:restore-check
      - name: Logs bij falen
        if: failure()
        run: tail -n 100 web.log worker.log || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Afhankelijkheden op bekende kwetsbaarheden (hoog en kritiek)
        run: pnpm audit --prod --audit-level=high
      - name: Geheimen in de volledige git-geschiedenis (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  demo-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: px
          POSTGRES_PASSWORD: px
          POSTGRES_DB: px_online
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U px -d px_online" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Image voor de online demo bouwen
        run: docker build -t px-demo .
      - name: Starten zoals Railway (https-demo met wachtwoord en eigen geheimen)
        run: |
          cat > online.env <<ENV
          APP_MODE=demo
          DEMO_LOGIN_ENABLED=true
          DEMO_ACCESS_PASSWORD=ci-demo-wachtwoord
          DATABASE_URL=postgres://px:px@localhost:5432/px_online
          WEB_BASE_URL=https://demo.example.test
          AUTH_URL=https://demo.example.test
          AUTH_SECRET=$(openssl rand -hex 32)
          PAYMENT_WEBHOOK_SECRET=$(openssl rand -hex 32)
          DROP_SEED_KEY=$(openssl rand -hex 32)
          PAYMENT_PROVIDER=demo
          IDENTITY_PROVIDER=demo
          FOOTBALL_DATA_PROVIDER=fixture
          NOTIFICATION_PROVIDER=demo
          PORT=3000
          ENV
          docker run -d --name web --network host --env-file online.env px-demo bash deploy/start.sh web
          for i in $(seq 1 60); do curl -fs http://localhost:3000/api/v1/health > /dev/null && break; sleep 3; done
          docker logs web | tail -5
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/markt)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u demo:fout http://localhost:3000/markt)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u demo:ci-demo-wachtwoord http://localhost:3000/markt)" = "200"
          curl -s -u demo:ci-demo-wachtwoord "http://localhost:3000/api/v1/players?q=Noah" | grep -q "Noah Vermeer"
          docker run -d --name worker --network host --env-file online.env px-demo bash deploy/start.sh worker
          sleep 20
          docker logs worker 2>&1 | grep -q '"msg":"worker started"'
      - name: Weigert een online demo zonder wachtwoord
        run: |
          grep -v DEMO_ACCESS_PASSWORD online.env > open.env
          ! docker run --rm --network host --env-file open.env px-demo bash deploy/start.sh web
      - name: Logs bij falen
        if: failure()
        run: docker logs web 2>&1 | tail -50; docker logs worker 2>&1 | tail -30
